<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube AutoPost PRO</title><style>body{font-family:system-ui;background:#10101c;color:#f5f4ff;margin:0}header{background:#1c1931;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 16px}h1,h2{margin:10px 0 18px}a{color:#bca8ff}button,.btn{background:#7545df;color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;text-decoration:none;display:inline-block}input,select,textarea{background:#29263c;color:white;border:1px solid #534b71;border-radius:8px;padding:10px;box-sizing:border-box;width:100%;margin:5px 0 13px}label{font-size:14px}section,.card{background:#1d1b2e;border:1px solid #343049;border-radius:13px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.muted{color:#aaa5bf}.online{color:#5cdb9d}.offline{color:#ff7777}.verificando{color:#ffd075}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #3c3850;padding:12px}small{color:#aaa5bf}.flash{background:#493a61;padding:12px;border-radius:9px;margin:12px 0}form.inline{display:inline}form.inline button{padding:7px 11px}nav{display:flex;gap:12px;align-items:center}</style></head><body><header><strong>▶ YouTube AutoPost PRO</strong><nav>{% if session.get('uid') %}<a href="/">Painel</a><form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{csrf()}}"><button>Sair</button></form>{% endif %}</nav></header><main>{% for msg in get_flashed_messages() %}<div class="flash">{{msg}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
